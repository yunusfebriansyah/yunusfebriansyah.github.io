<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ular Tangga Couple</title>
    <style>
        /* --- CSS VARIABLES (Dark/Light Support) --- */
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --text-main: #2C3E50;
            --bg-body: #F7F9FC;
            --card-bg: #ffffff;
            --board-bg: #ffffff;
            --border-color: #eee;
            --square-text: #bdc3c7;
            --dice-bg: #ffffff;
            --dice-border: #333;
            --dot-color: #333;
            --shadow-color: rgba(0,0,0,0.1);
            
            /* Player Colors */
            --p1-color: #FF9F43; 
            --p2-color: #FF6B81; 
            
            --square-size: clamp(28px, 8vw, 60px);
            --dice-size: 60px;
        }

        /* Dark Mode Override */
        @media (prefers-color-scheme: dark) {
            :root {
                --text-main: #ecf0f1;
                --bg-body: #121212;
                --card-bg: #1e1e1e;
                --board-bg: #1e1e1e;
                --border-color: #333;
                --square-text: #7f8c8d;
                --dice-bg: #2c2c2c;
                --dice-border: #555;
                --dot-color: #ecf0f1;
                --shadow-color: rgba(0,0,0,0.4);
            }
            .square { border-color: #333; }
            .cube__face { background: var(--dice-bg); border-color: var(--dice-border); box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
            .dot { background-color: var(--dot-color); }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        header { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 10px; }
        h1 { font-size: 1.4rem; color: var(--primary); }
        .btn-settings {
            background: var(--bg-body); border: 1px solid var(--border-color); 
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; 
            font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
            color: var(--text-main);
        }

        /* GAME CONTAINER */
        .game-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 1000px;
        }

        @media (min-width: 768px) {
            .game-container { flex-direction: row; align-items: center; justify-content: center; }
            .board-wrapper { order: 1; }
            .controls { order: 2; }
        }

        /* BOARD */
        .board-wrapper {
            position: relative;
            padding: 5px;
            background: var(--board-bg);
            border-radius: 12px;
            box-shadow: 0 5px 15px var(--shadow-color);
            user-select: none;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(10, var(--square-size));
            grid-template-rows: repeat(10, var(--square-size));
            position: relative;
        }

        .square {
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            color: var(--square-text);
            position: relative;
        }
        .square[data-num="100"] { background-color: var(--secondary) !important; color: white; border-radius: 0 0 8px 0; font-weight: bold; }
        .square[data-num="1"] { background-color: var(--primary) !important; color: white; border-radius: 0 8px 0 0; font-weight: bold; }
        .square[data-type="ladder"] { background-color: rgba(78, 205, 196, 0.1); }
        .square[data-type="snake"] { background-color: rgba(255, 107, 107, 0.1); }

        /* TOKENS */
        .player-token {
            position: absolute;
            width: calc(var(--square-size) * 0.35);
            height: calc(var(--square-size) * 0.35);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border: 2px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: top 0.3s linear, left 0.3s linear; 
        }
        .player-token svg { width: 70%; height: 70%; fill: white; }
        .p1-token { background-color: var(--p1-color); top: 30%; left: 30%; z-index: 11; } 
        .p2-token { background-color: var(--p2-color); top: 30%; right: 30%; }

        /* SVG OVERLAY */
        .svg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        /* CONTROLS */
        .controls {
            flex: 0 0 300px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px var(--shadow-color);
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .status-card {
            width: 100%;
            text-align: center;
            background: var(--bg-body);
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid var(--secondary);
        }
        .current-turn { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .position-display { font-size: 0.85rem; opacity: 0.8; display: flex; justify-content: space-around; }

        /* 3D DICE */
        .dice-scene { width: var(--dice-size); height: var(--dice-size); perspective: 400px; margin: 10px auto; }
        .cube { 
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d; 
            transform: translateZ(-30px); 
            transition: transform 1s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        .cube.rolling { animation: spin 0.4s infinite linear; }
        
        @keyframes spin { 
            0% { transform: translateZ(-30px) rotateX(0deg) rotateY(0deg) rotateZ(0deg); } 
            100% { transform: translateZ(-30px) rotateX(360deg) rotateY(360deg) rotateZ(360deg); } 
        }
        
        .cube__face { 
            position: absolute; width: var(--dice-size); height: var(--dice-size); 
            background: var(--dice-bg); border: 2px solid var(--dice-border); border-radius: 10px; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 8px;
        }

        /* Dot Styles */
        .dot { background-color: var(--dot-color); border-radius: 50%; width: 80%; height: 80%; justify-self: center; align-self: center; }
        .p1 { grid-area: 1 / 1; } .p2 { grid-area: 1 / 2; } .p3 { grid-area: 1 / 3; }
        .p4 { grid-area: 2 / 1; } .p5 { grid-area: 2 / 2; } .p6 { grid-area: 2 / 3; }
        .p7 { grid-area: 3 / 1; } .p8 { grid-area: 3 / 2; } .p9 { grid-area: 3 / 3; }

        .cube__face--1 { transform: rotateY(0deg) translateZ(30px); }
        .cube__face--2 { transform: rotateY(90deg) translateZ(30px); }
        .cube__face--3 { transform: rotateY(180deg) translateZ(30px); }
        .cube__face--4 { transform: rotateY(-90deg) translateZ(30px); }
        .cube__face--5 { transform: rotateX(90deg) translateZ(30px); }
        .cube__face--6 { transform: rotateX(-90deg) translateZ(30px); }

        .btn-roll { background-color: var(--primary); color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #c0392b; }
        .btn-roll:active { transform: translateY(4px); box-shadow: 0 0 0 #c0392b; }
        .btn-roll:disabled { background-color: #95a5a6; box-shadow: none; cursor: not-allowed; transform: none; }

        /* TOAST */
        #toast-container {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; gap: 10px; z-index: 50;
            width: 90%; max-width: 350px; pointer-events: none;
        }
        .toast {
            background: var(--text-main); color: var(--bg-body); padding: 12px 20px;
            border-radius: 30px; text-align: center; font-size: 0.95rem;
            animation: slideIn 0.3s ease-out; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* MODALS */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(3px);
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal {
            background: var(--card-bg); width: 90%; max-width: 400px; padding: 25px; border-radius: 20px;
            text-align: center; transform: translateY(20px); transition: transform 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            color: var(--text-main);
        }
        .modal-overlay.active .modal { transform: translateY(0); }
        
        .modal-icon { font-size: 3rem; margin-bottom: 10px; display: block; }
        .modal h2 { color: var(--primary); margin-bottom: 10px; font-size: 1.4rem; }
        .modal-content-text { font-size: 1rem; margin-bottom: 20px; line-height: 1.5; min-height: 60px; display: flex; align-items: center; justify-content: center; text-align: center; }
        
        /* Inputs */
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: bold; }
        .api-input { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-body); color: var(--text-main); }

        .choice-buttons, .action-buttons { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 20px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; flex: 1; font-size: 0.9rem; transition: 0.2s; color: white; }
        .btn-truth { background: #54a0ff; }
        .btn-dare { background: #ff9f43; }
        .btn-continue { background: var(--secondary); width: 100%; }
        .btn-save { background: var(--primary); }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .ai-loading { font-style: italic; opacity: 0.7; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

    </style>
</head>
<body>

    <header>
        <h1>🏠 Ular Tangga Couple</h1>
        <button class="btn-settings" onclick="openSettings()">⚙️</button>
    </header>

    <!-- NOTIFICATION AREA -->
    <div id="toast-container"></div>

    <main class="game-container">
        <!-- PAPAN (Kiri Desktop) -->
        <div class="board-wrapper">
            <div class="board" id="board"></div>
            <svg class="svg-overlay" id="svgOverlay" viewBox="0 0 600 600" preserveAspectRatio="none"></svg>
            
            <div id="p1Token" class="player-token p1-token">
                <svg viewBox="0 0 24 24"><path d="M12 2C13.657 2 15 3.343 15 5C15 6.657 13.657 8 12 8C10.343 8 9 6.657 9 5C9 3.343 10.343 2 12 2ZM12 10C14.757 10 17 12.243 17 15V21C17 21.552 16.552 22 16 22H8C7.448 22 7 21.552 7 21V15C7 12.243 9.243 10 12 10Z"/></svg>
            </div>
            <div id="p2Token" class="player-token p2-token">
                <svg viewBox="0 0 24 24"><path d="M12 2C14.21 2 16 3.79 16 6C16 8.21 14.21 10 12 10C9.79 10 8 8.21 8 6C8 3.79 9.79 2 12 2ZM12 12C14.67 12 17.09 13.03 18.82 14.68C18.3 14.89 17.74 15 17.16 15C16.39 15 15.65 14.82 14.96 14.48C14.06 14.05 13.05 13.82 12 13.82C10.95 13.82 9.94 14.05 9.04 14.48C8.35 14.82 7.61 15 6.84 15C6.26 15 5.7 14.89 5.18 14.68C6.91 13.03 9.33 12 12 12Z"/></svg>
            </div>
        </div>

        <!-- KONTROL (Kanan Desktop) -->
        <aside class="controls">
            <div class="status-card">
                <div class="current-turn" id="turnIndicator" style="color: var(--p1-color)">
                    Giliran: Suami
                </div>
                <div class="position-display">
                    <span>👨 Suami: <b id="p1Pos">1</b></span>
                    <span>👩 Istri: <b id="p2Pos">1</b></span>
                </div>
            </div>

            <div class="dice-scene">
                <div class="cube" id="diceCube">
                    <!-- Face 1 -->
                    <div class="cube__face cube__face--1"><div class="dot p5"></div></div>
                    <!-- Face 2 -->
                    <div class="cube__face cube__face--2"><div class="dot p1"></div><div class="dot p9"></div></div>
                    <!-- Face 3 -->
                    <div class="cube__face cube__face--3"><div class="dot p1"></div><div class="dot p5"></div><div class="dot p9"></div></div>
                    <!-- Face 4 -->
                    <div class="cube__face cube__face--4"><div class="dot p1"></div><div class="dot p3"></div><div class="dot p7"></div><div class="dot p9"></div></div>
                    <!-- Face 5 -->
                    <div class="cube__face cube__face--5"><div class="dot p1"></div><div class="dot p3"></div><div class="dot p5"></div><div class="dot p7"></div><div class="dot p9"></div></div>
                    <!-- Face 6 -->
                    <div class="cube__face cube__face--6"><div class="dot p1"></div><div class="dot p4"></div><div class="dot p7"></div><div class="dot p3"></div><div class="dot p6"></div><div class="dot p9"></div></div>
                </div>
            </div>
            
            <button class="btn-roll" id="rollBtn" onclick="playTurn()">Kocok Dadu!</button>
        </aside>
    </main>

    <!-- MODAL SETTINGS -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <span class="modal-icon">⚙️</span>
            <h2>Pengaturan AI</h2>
            <div class="input-group">
                <label>API Token Hugging Face</label>
                <input type="password" id="apiKeyInput" class="api-input" placeholder="hf_xxxxxxxxxxxxxxxxxxxxx">
                <small style="color:#666; display:block; margin-top:5px;">Token hanya untuk fitur Truth. Dare manual.</small>
            </div>
            <div class="action-buttons">
                <button class="btn btn-save" onclick="saveSettings()">Simpan</button>
                <button class="btn" style="background:#95a5a6" onclick="closeModal('settingsModal')">Tutup</button>
            </div>
        </div>
    </div>

    <!-- MODAL GAME -->
    <div class="modal-overlay" id="gameModal">
        <div class="modal">
            <span class="modal-icon" id="modalIcon">🤔</span>
            <h2 id="modalTitle">Pilihan!</h2>
            
            <div class="modal-content-text" id="modalText">
                Pilih Truth atau Dare
            </div>
            
            <div class="choice-buttons" id="choiceButtons">
                <button class="btn btn-truth" onclick="handleChoice('truth')">TRUTH</button>
                <button class="btn btn-dare" onclick="handleChoice('dare')">DARE</button>
            </div>

            <div class="action-buttons" id="continueContainer" style="display:none;">
                <button class="btn btn-continue" onclick="closeModal('gameModal')">Lanjut</button>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI ---
        const snakes = { 16: 6, 46: 25, 49: 11, 62: 19, 64: 60, 74: 53, 89: 68, 92: 88, 95: 75, 99: 80 };
        const ladders = { 2: 38, 7: 14, 8: 31, 15: 26, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 78: 98, 87: 94 };
        
        let players = [
            { id: 1, name: "Suami", pos: 1, color: "var(--p1-color)" },
            { id: 2, name: "Istri", pos: 1, color: "var(--p2-color)" }
        ];
        let turn = 0; 
        let isRolling = false;
        let lastRollResult = 0;

        // --- API TOKEN MANAGEMENT ---
        let hfToken = localStorage.getItem('hf_token') || "";

        function openSettings() {
            document.getElementById('apiKeyInput').value = hfToken;
            document.getElementById('settingsModal').classList.add('active');
        }

        function saveSettings() {
            const input = document.getElementById('apiKeyInput').value.trim();
            if(input.startsWith('hf_')) {
                hfToken = input;
                localStorage.setItem('hf_token', hfToken);
                showToast("API Token tersimpan!", '✅');
                closeModal('settingsModal');
            } else {
                alert("Format token salah (harus dimulai dengan 'hf_')");
            }
        }

        // --- INIT BOARD ---
        const boardEl = document.getElementById('board');
        function createBoard() {
            boardEl.innerHTML = '';
            for (let row = 10; row >= 1; row--) {
                let rowNumbers = [];
                for(let i = (row-1)*10 + 1; i <= row*10; i++) rowNumbers.push(i);
                if (row % 2 !== 0) rowNumbers.reverse();

                rowNumbers.forEach(num => {
                    const div = document.createElement('div');
                    div.className = 'square';
                    div.dataset.num = num;
                    div.id = `sq-${num}`;
                    div.innerText = num;
                    if(snakes[num]) div.dataset.type = "snake";
                    if(ladders[num]) div.dataset.type = "ladder";
                    boardEl.appendChild(div);
                });
            }
            updatePos(1, 1);
            updatePos(2, 1);
        }

        function updatePos(pid, pos) {
            const sq = document.getElementById(`sq-${pos}`);
            const token = document.getElementById(pid === 1 ? 'p1Token' : 'p2Token');
            if(!sq || !token) return;

            const boardRect = boardEl.getBoundingClientRect();
            const sqRect = sq.getBoundingClientRect();
            
            const top = sqRect.top - boardRect.top + (sqRect.height / 2) - (token.offsetHeight / 2);
            const left = sqRect.left - boardRect.left + (sqRect.width / 2) - (token.offsetWidth / 2);
            const finalLeft = pid === 1 ? left - 3 : left + 3;

            token.style.top = `${top}px`;
            token.style.left = `${finalLeft}px`;
        }

        function drawLines() {
            setTimeout(() => {
                const svg = document.getElementById('svgOverlay');
                let html = '';
                const line = (s, e, c, type) => {
                    const elS = document.getElementById(`sq-${s}`);
                    const elE = document.getElementById(`sq-${e}`);
                    if(!elS || !elE) return '';
                    const x1 = (elS.offsetLeft + elS.offsetWidth/2);
                    const y1 = (elS.offsetTop + elS.offsetHeight/2);
                    const x2 = (elE.offsetLeft + elE.offsetWidth/2);
                    const y2 = (elE.offsetTop + elE.offsetHeight/2);
                    if(type === 'ladder') return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="6" stroke-dasharray="5,5" stroke-linecap="round" opacity="0.6"/>`;
                    return `<path d="M ${x1} ${y1} Q ${x1+20} ${y1+40}, ${x2} ${y2}" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>`;
                };
                for(const [s,e] of Object.entries(ladders)) html += line(s,e,'#4ECDC4','ladder');
                for(const [s,e] of Object.entries(snakes)) html += line(s,e,'#FF6B6B','snake');
                svg.innerHTML = html;
                svg.setAttribute('viewBox', `0 0 ${boardEl.offsetWidth} ${boardEl.offsetHeight}`);
            }, 100);
        }

        function showToast(message, icon = '') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function playTurn() {
            if(isRolling) return;
            isRolling = true;
            document.getElementById('rollBtn').disabled = true;
            
            const cube = document.getElementById('diceCube');
            cube.classList.add('rolling');
            
            const steps = Math.floor(Math.random() * 6) + 1;
            lastRollResult = steps;
            
            await delay(600);
            cube.classList.remove('rolling');
            
            let x = 0, y = 0;
            switch(steps) {
                case 1: x = 0; y = 0; break;
                case 2: x = 0; y = -90; break; 
                case 3: x = 0; y = -180; break;
                case 4: x = 0; y = 90; break;
                case 5: x = -90; y = 0; break;
                case 6: x = 90; y = 0; break;
            }
            
            cube.style.transform = `translateZ(-30px) rotateX(${x + 720}deg) rotateY(${y + 720}deg)`;

            await delay(1000); 
            showToast(`${players[turn].name} dapat angka ${steps}`, '🎲');

            await delay(500); 
            await animateWalk(players[turn], steps);
        }

        async function animateWalk(player, steps) {
            let current = player.pos;
            let target = current + steps;
            if(target > 100) {
                const excess = target - 100;
                target = 100 - excess;
                showToast("Kelebihan! Mundur...", '🚫');
            }

            while(current !== target) {
                current += (target > current) ? 1 : -1;
                player.pos = current;
                updatePos(player.id, current);
                document.getElementById(player.id === 1 ? 'p1Pos' : 'p2Pos').innerText = current;
                await delay(300); 
            }

            await checkSpecial(player, lastRollResult);
        }

        async function checkSpecial(player, rollValue) {
            let special = false;
            let type = '';
            let newPos = player.pos;

            if(snakes[player.pos]) {
                newPos = snakes[player.pos];
                special = true; type = 'snake';
                showToast(`🐍 Oh no! Turun ke ${newPos}`);
            } else if(ladders[player.pos]) {
                newPos = ladders[player.pos];
                special = true; type = 'ladder';
                showToast(`🪢 Yey! Naik ke ${newPos}`);
            }

            if(special) {
                await delay(500);
                player.pos = newPos;
                updatePos(player.id, newPos);
                document.getElementById(player.id === 1 ? 'p1Pos' : 'p2Pos').innerText = newPos;
                await delay(800); 
                openModal(player, type, rollValue);
            } else {
                handleTurnConclusion(rollValue);
            }
        }

        // --- AI: HUGGING FACE ROUTER (HANYA UNTUK TRUTH) ---
        async function query(data) {
            if (!hfToken) {
                throw new Error("Token Belum Diisi");
            }

            const response = await fetch(
                "https://router.huggingface.co/v1/chat/completions",
                {
                    headers: {
                        Authorization: `Bearer ${hfToken}`,
                        "Content-Type": "application/json",
                    },
                    method: "POST",
                    body: JSON.stringify(data),
                }
            );
            
            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || "Gagal menghubungi AI");
            }
            
            const result = await response.json();
            return result;
        }

        // --- MODAL LOGIC ---
        let currentModalPlayer = null;

        async function openModal(player, type, rollValue) {
            currentModalPlayer = player;
            const modal = document.getElementById('gameModal');
            const title = document.getElementById('modalTitle');
            const icon = document.getElementById('modalIcon');
            const text = document.getElementById('modalText');
            const choices = document.getElementById('choiceButtons');
            const cont = document.getElementById('continueContainer');

            modal.classList.add('active');
            choices.style.display = 'flex';
            cont.style.display = 'none';
            
            // Reset View saat buka modal
            text.style.display = 'flex';
            text.innerText = `Ini tantangan khusus untuk ${player.name}! Pilih Truth atau Dare:`;

            const targetText = type === 'snake' ? "Hukuman" : "Bonus";
            icon.innerText = type === 'snake' ? '🐍' : '🪜';
            title.innerText = `${targetText} Khusus!`;
            title.style.color = type === 'snake' ? "#FF6B6B" : "#4ECDC4";
        }

        async function handleChoice(choice) {
            const textEl = document.getElementById('modalText');
            const titleEl = document.getElementById('modalTitle');
            const choices = document.getElementById('choiceButtons');
            const cont = document.getElementById('continueContainer');

            choices.style.display = 'none';

            const partner = players[turn === 0 ? 1 : 0].name;
            const player = players[turn].name;

            if (choice === 'truth') {
                // --- LOGIKA TRUTH (PAKAI AI) ---
                titleEl.innerText = "❓ Truth Question";
                titleEl.style.color = "#54a0ff";
                textEl.innerHTML = '<div class="ai-loading">Loading ...</div>';
                textEl.style.display = 'flex';
                cont.style.display = 'none'; // Sembunyikan lanjut sampai AI selesai

                let systemPrompt = "Kamu adalah Game Master untuk pasangan suami istri. Fokus pada hal-hal yang menyenangkan, romantis, dan lucu.";
                let userPrompt = `
                Buat 1 pertanyaan Truth tentang pasangan.
                Nama Pem bertanya: ${player}.
                Nama Pasangan: ${partner}.
                
                ATURAN PENTING:
                1. Pertanyaan harus MANIS, LUCU, atau ROMANTIS ringan.
                2. JANGAN bertanya hal berat, masalah, atau hal pribadi yang sensitif.
                3. Tanyakan hal sederhana seperti kebiasaan lucu, makanan favorit, atau momen manis.
                4. Jawaban SINGKAT (maksimal 1 kalimat).
                5. Langsung tulis pertanyaannya saja dalam Bahasa Indonesia.
                `;

                try {
                    const response = await query({ 
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userPrompt },
                        ],
                        model: "meta-llama/Llama-3.1-8B-Instruct:novita",
                    });

                    let result = response.choices[0].message.content;
                    result = result.replace(/^(Suami|Istri|User|Assistant):\s*/, '');
                    result = result.replace(/^"|"$/g, ''); 
                    textEl.innerText = result;
                    cont.style.display = 'flex'; // Tampilkan tombol lanjut

                } catch (e) {
                    console.error("AI Error:", e);
                    if(e.message === "Token Belum Diisi") {
                        textEl.innerText = "Silakan isi API Token di menu Pengaturan (⚙️) terlebih dahulu.";
                        choices.style.display = 'flex'; // Kembali ke pilihan
                    } else {
                        textEl.innerText = "Gagal menghubungi AI. Gunakan mode offline (Fallback).";
                        const fallbackResult = `Apa hal paling lucu tentang ${partner}?`;
                        textEl.innerText = fallbackResult;
                        cont.style.display = 'flex';
                    }
                }

            } else {
                // --- LOGIKA DARE (LISAN MANUAL) ---
                titleEl.innerText = "🔥 Waktunya Berimajinasi!";
                titleEl.style.color = "#ff9f43";
                
                // Instruksi Lisan
                textEl.innerText = "Silakan tentukan tantangan sendiri secara lisan untuk pasanganmu. Bisa apa saja yang seru!";
                textEl.style.display = 'flex';
                
                // Langsung tampilkan tombol lanjut (karena tidak butuh loading AI)
                cont.style.display = 'flex';
            }
        }

        function handleTurnConclusion(rollValue) {
            if(players[turn].pos === 100) {
                showToast(`🏆 ${players[turn].name} MENANG!`, '🏆');
                isRolling = false;
                document.getElementById('rollBtn').disabled = false; 
                return;
            }

            if (rollValue === 6) {
                showToast(`Dapat angka 6! ${players[turn].name} main lagi.`, '🎲');
                isRolling = false;
                document.getElementById('rollBtn').disabled = false;
            } else {
                turn = turn === 0 ? 1 : 0;
                const turnEl = document.getElementById('turnIndicator');
                turnEl.innerText = `Giliran: ${players[turn].name}`;
                turnEl.style.color = players[turn].color;
                
                isRolling = false;
                document.getElementById('rollBtn').disabled = false;
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            if(id === 'gameModal') {
                handleTurnConclusion(lastRollResult);
            }
        }

        window.onload = () => {
            createBoard();
            drawLines();
            window.addEventListener('resize', drawLines);
        };
    </script>
</body>
</html>
